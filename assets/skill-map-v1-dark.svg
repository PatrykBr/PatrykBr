<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">Skill map</title>
  <desc id="desc">A transit-map style overview of Patryk's web, backend, machine learning, trading and developer tooling skills.</desc>
  <rect width="1200" height="410" rx="22" fill="#0d1117"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="34" y="38" fill="#8b949e" font-size="13" font-weight="700" letter-spacing="2.4">SKILL MAP</text>
    <text x="1166" y="38" text-anchor="end" fill="#6e7681" font-size="12">web · systems · ML/data · trading · tooling</text>

    <!-- Web route -->
    <rect x="32" y="65" width="70" height="24" rx="12" fill="#1f6feb" opacity="0.22"/>
    <text x="67" y="81" text-anchor="middle" fill="#79c0ff" font-size="12" font-weight="700">WEB</text>
    <path d="M112 77 H1088" fill="none" stroke="#1f6feb" stroke-width="7" stroke-linecap="round"/>
    <g fill="#0d1117" stroke="#58a6ff" stroke-width="4">
      <circle cx="190" cy="77" r="9"/><circle cx="365" cy="77" r="9"/><circle cx="548" cy="77" r="9"/><circle cx="735" cy="77" r="9"/><circle cx="930" cy="77" r="9"/>
    </g>
    <g fill="#f0f6fc" font-size="14" font-weight="700" text-anchor="middle">
      <text x="190" y="55">TypeScript</text><text x="365" y="55">React</text><text x="548" y="55">Next.js</text><text x="735" y="55">Tailwind</text><text x="930" y="55">UI / accessibility</text>
    </g>

    <!-- Backend route -->
    <rect x="32" y="135" width="90" height="24" rx="12" fill="#238636" opacity="0.22"/>
    <text x="77" y="151" text-anchor="middle" fill="#56d364" font-size="12" font-weight="700">BACKEND</text>
    <path d="M132 147 H1088" fill="none" stroke="#238636" stroke-width="7" stroke-linecap="round"/>
    <g fill="#0d1117" stroke="#3fb950" stroke-width="4">
      <circle cx="215" cy="147" r="9"/><circle cx="390" cy="147" r="9"/><circle cx="570" cy="147" r="9"/><circle cx="760" cy="147" r="9"/><circle cx="950" cy="147" r="9"/>
    </g>
    <g fill="#f0f6fc" font-size="14" font-weight="700" text-anchor="middle">
      <text x="215" y="125">Go</text><text x="390" y="125">FastAPI</text><text x="570" y="125">PostgreSQL</text><text x="760" y="125">Docker</text><text x="950" y="125">Linux</text>
    </g>

    <!-- ML route -->
    <rect x="32" y="205" width="80" height="24" rx="12" fill="#8957e5" opacity="0.24"/>
    <text x="72" y="221" text-anchor="middle" fill="#d2a8ff" font-size="12" font-weight="700">ML / DATA</text>
    <path d="M122 217 H1088" fill="none" stroke="#8957e5" stroke-width="7" stroke-linecap="round"/>
    <g fill="#0d1117" stroke="#a371f7" stroke-width="4">
      <circle cx="210" cy="217" r="9"/><circle cx="398" cy="217" r="9"/><circle cx="600" cy="217" r="9"/><circle cx="820" cy="217" r="9"/><circle cx="1005" cy="217" r="9"/>
    </g>
    <g fill="#f0f6fc" font-size="14" font-weight="700" text-anchor="middle">
      <text x="210" y="195">Python</text><text x="398" y="195">Optuna</text><text x="600" y="195">Synthetic data</text><text x="820" y="195">Transformers</text><text x="1005" y="195">Analysis</text>
    </g>

    <!-- Trading route -->
    <rect x="32" y="275" width="84" height="24" rx="12" fill="#d29922" opacity="0.22"/>
    <text x="74" y="291" text-anchor="middle" fill="#e3b341" font-size="12" font-weight="700">TRADING</text>
    <path d="M126 287 H1088" fill="none" stroke="#d29922" stroke-width="7" stroke-linecap="round"/>
    <g fill="#0d1117" stroke="#e3b341" stroke-width="4">
      <circle cx="220" cy="287" r="9"/><circle cx="420" cy="287" r="9"/><circle cx="620" cy="287" r="9"/><circle cx="825" cy="287" r="9"/><circle cx="1010" cy="287" r="9"/>
    </g>
    <g fill="#f0f6fc" font-size="14" font-weight="700" text-anchor="middle">
      <text x="220" y="265">TradingView</text><text x="420" y="265">MT4 / MT5</text><text x="620" y="265">Backtesting</text><text x="825" y="265">Automation</text><text x="1010" y="265">Execution</text>
    </g>

    <!-- Tooling route with transfers -->
    <rect x="32" y="345" width="78" height="24" rx="12" fill="#f0883e" opacity="0.22"/>
    <text x="71" y="361" text-anchor="middle" fill="#ffa657" font-size="12" font-weight="700">TOOLING</text>
    <path d="M120 357 H1088" fill="none" stroke="#f0883e" stroke-width="7" stroke-linecap="round"/>
    <g fill="#0d1117" stroke="#ffa657" stroke-width="4">
      <circle cx="215" cy="357" r="9"/><circle cx="405" cy="357" r="9"/><circle cx="600" cy="357" r="9"/><circle cx="805" cy="357" r="9"/><circle cx="1000" cy="357" r="9"/>
    </g>
    <g fill="#f0f6fc" font-size="14" font-weight="700" text-anchor="middle">
      <text x="215" y="390">Git</text><text x="405" y="390">GitHub Actions</text><text x="600" y="390">CI/CD</text><text x="805" y="390">Browser extensions</text><text x="1000" y="390">Zed tooling</text>
    </g>

    <!-- transfer links -->
    <path d="M760 156 V348" fill="none" stroke="#6e7681" stroke-width="2" stroke-dasharray="5 7"/>
    <circle cx="760" cy="147" r="13" fill="none" stroke="#c9d1d9" stroke-width="2"/>
    <circle cx="805" cy="357" r="13" fill="none" stroke="#c9d1d9" stroke-width="2"/>
    <text x="782" y="252" fill="#8b949e" font-size="11" transform="rotate(-90 782 252)">production / tooling crossover</text>

    <path d="M398 226 C430 245 500 263 620 278" fill="none" stroke="#6e7681" stroke-width="2" stroke-dasharray="5 7"/>
    <circle cx="398" cy="217" r="13" fill="none" stroke="#c9d1d9" stroke-width="2"/>
    <circle cx="620" cy="287" r="13" fill="none" stroke="#c9d1d9" stroke-width="2"/>
    <text x="500" y="248" fill="#8b949e" font-size="11">optimisation crossover</text>
  </g>
</svg>