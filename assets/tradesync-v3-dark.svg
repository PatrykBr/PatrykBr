<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="285" viewBox="0 0 1200 285" role="img" aria-labelledby="t d">
<title id="t">TradeSync</title><desc id="d">Private trading infrastructure project with account connections, copying, execution and analytics.</desc>
<rect width="1200" height="285" rx="20" fill="#0d1117" stroke="#30363d"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <text x="42" y="55" fill="#f0f6fc" font-size="31" font-weight="800">TradeSync</text>
  <rect x="198" y="29" width="74" height="26" rx="13" fill="#161b22" stroke="#30363d"/>
  <text x="235" y="47" text-anchor="middle" fill="#8b949e" font-size="12" font-weight="700">PRIVATE</text>
  <text x="42" y="86" fill="#8b949e" font-size="16">Trading infrastructure for connecting accounts, copying trades and managing execution.</text>

  <g font-size="14" font-weight="600">
    <rect x="42" y="112" width="150" height="34" rx="17" fill="#161b22" stroke="#30363d"/><text x="61" y="134" fill="#58a6ff">↔</text><text x="86" y="134" fill="#c9d1d9">Connections</text>
    <rect x="202" y="112" width="126" height="34" rx="17" fill="#161b22" stroke="#30363d"/><text x="221" y="134" fill="#58a6ff">⇄</text><text x="246" y="134" fill="#c9d1d9">Copying</text>
    <rect x="338" y="112" width="132" height="34" rx="17" fill="#161b22" stroke="#30363d"/><text x="357" y="134" fill="#58a6ff">⚡</text><text x="382" y="134" fill="#c9d1d9">Execution</text>
    <rect x="480" y="112" width="124" height="34" rx="17" fill="#161b22" stroke="#30363d"/><text x="499" y="134" fill="#58a6ff">▥</text><text x="524" y="134" fill="#c9d1d9">Analytics</text>
  </g>

  <text x="42" y="190" fill="#8b949e" font-size="13" font-weight="700" letter-spacing="2">STACK</text>
  <text x="42" y="219" fill="#79c0ff" font-size="16">React · TypeScript · Go · PostgreSQL · NATS · Docker</text>
  <text x="42" y="250" fill="#8b949e" font-size="13">multi-account trading infrastructure</text>

  <line x1="652" y1="45" x2="652" y2="240" stroke="#21262d"/>
  <text x="692" y="55" fill="#8b949e" font-size="13" font-weight="700" letter-spacing="2">SYSTEM FLOW</text>

