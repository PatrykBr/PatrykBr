  <text x="751" y="143" text-anchor="middle" fill="#8b949e" font-size="12">React · TS</text>

  <rect x="856" y="101" width="118" height="54" rx="14" fill="#161b22" stroke="#58a6ff"/>
  <text x="915" y="124" text-anchor="middle" fill="#f0f6fc" font-size="17" font-weight="700">Go API</text>
  <text x="915" y="143" text-anchor="middle" fill="#8b949e" font-size="12">core backend</text>

  <rect x="1020" y="72" width="132" height="54" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="1086" y="95" text-anchor="middle" fill="#f0f6fc" font-size="17" font-weight="700">MT4 / MT5</text>
  <text x="1086" y="114" text-anchor="middle" fill="#8b949e" font-size="12">execution</text>

  <rect x="1020" y="158" width="132" height="54" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="1086" y="181" text-anchor="middle" fill="#f0f6fc" font-size="17" font-weight="700">PostgreSQL</text>
  <text x="1086" y="200" text-anchor="middle" fill="#8b949e" font-size="12">data</text>

  <rect x="856" y="190" width="118" height="44" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="915" y="217" text-anchor="middle" fill="#f0f6fc" font-size="16" font-weight="700">NATS</text>

