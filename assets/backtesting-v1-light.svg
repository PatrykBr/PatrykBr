<svg xmlns="http://www.w3.org/2000/svg" width="960" height="170" viewBox="0 0 960 170" role="img" aria-labelledby="title desc">
  <title id="title">Manual backtesting time</title>
  <desc id="desc">Relative manual backtesting time before and with the TradingView Strategy Optimiser, showing approximately 90 percent less manual time.</desc>
  <rect width="960" height="170" rx="18" fill="#ffffff"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="28" y="34" fill="#1f2328" font-size="16" font-weight="700">Manual backtesting time</text>
    <text x="932" y="34" text-anchor="end" fill="#57606a" font-size="12">relative</text>

    <text x="28" y="78" fill="#24292f" font-size="13">Before</text>
    <rect x="132" y="63" width="740" height="20" rx="10" fill="#d8dee4"/>
    <rect x="132" y="63" width="740" height="20" rx="10" fill="#8c959f"/>
    <text x="888" y="78" fill="#57606a" font-size="12">100%</text>

    <text x="28" y="122" fill="#24292f" font-size="13">With optimiser</text>
    <rect x="132" y="107" width="740" height="20" rx="10" fill="#d8dee4"/>
    <rect x="132" y="107" width="74" height="20" rx="10" fill="#0969da"/>
    <text x="218" y="122" fill="#0969da" font-size="12" font-weight="700">~10%</text>

    <text x="932" y="150" text-anchor="end" fill="#0969da" font-size="14" font-weight="700">~90% less manual backtesting</text>
  </g>
</svg>